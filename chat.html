<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 🔧 Configuration Script -->
    <script>
      window.ChatWidgetConfig = {
        apiKey: "abc123dummyapikey", // Replace with real key in prod

        // 🔓 Lifecycle Events (optional)
        onOpen: () => console.log("✅ Chatbot opened"),
        onClose: () => console.log("❌ Chatbot closed"),
        onLoad: (meta) => console.log("🤖 Chatbot loaded", meta),
        onMessage: (msg) => console.log("📩 New message from user:", msg),

        // Future-proof custom events
        onChatbotReady: () => console.log("🎉 Chatbot is ready"),
      };
    </script>

    <!-- 🚀 Load the Chat Widget Script -->
    <script
      src="http://localhost:3000/widget.js"
      data-api-key="abc123dummyapikey"
    ></script>
  </body>
</html>
